# Configuration of the maintainer tests; see tests/README.md. Not meant for students.
[pytest]
testpaths = tests
markers =
    algorithm: runs the real algorithm with the vantage6 mock client (needs tests/requirements-algorithm.txt)
    devnetwork: runs the notebook against a running vantage6 developer network
# The slower tests only run when they are selected explicitly, e.g. 'pytest -m algorithm'
addopts = -m "not algorithm and not devnetwork"
